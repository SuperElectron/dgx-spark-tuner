[project]
name = "experiment"
version = "0.1.0"
description = "Run one benchmark experiment and archive it reproducibly"
requires-python = ">=3.13"
dependencies = ["sparkrun>=0.3.5"]

[project.scripts]
run-experiment = "run_experiment:main"

[tool.uv]
package = false

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
